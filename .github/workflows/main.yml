
name: Build Chat APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Accept Android SDK Licenses
        run: |
          SDKMANAGER="$(find "${ANDROID_HOME}/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)"

          yes | "$SDKMANAGER" --licenses || true

          "$SDKMANAGER" --install \
            "platform-tools" \
            "platforms;android-34" \
            "build-tools;34.0.0"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.2'

      - name: Verify Project
        run: |
          cd Chat
          ls -la
          test -f settings.gradle
          test -f build.gradle
          test -f app/build.gradle

      - name: Build Release APK
        working-directory: Chat
        run: |
          gradle --no-daemon --stacktrace :app:assembleRelease

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Chat-release-apk
          path: Chat/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 7
